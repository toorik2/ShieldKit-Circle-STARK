[package]
name = "circle-fri-worker"
version = "0.1.0"
edition = "2021"
description = "Circle FRI prove worker (M31, n=32, 8 queries). Same role as Toorik fri-worker: heavy prove only. Not 128-bit sound."
license = "UNLICENSED"
publish = false

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
rayon = "1.10"
stwo = { git = "https://github.com/starkware-libs/stwo.git", rev = "826591c6c371376810ca8213b5812d5daf6d5092", features = ["prover"] }
